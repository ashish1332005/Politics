services:
  - type: web
    name: politics-backend
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PYTHON_PATH
        value: python3
      - key: PDFTOPPM_PATH
        value: pdftoppm
      - key: PDFIMAGES_PATH
        value: pdfimages
      - key: TESSERACT_PATH
        value: tesseract
      - key: IMAGEMAGICK_PATH
        value: magick
      - key: OCR_LANGUAGES
        value: hin+eng
      - key: OCR_DPI
        value: 200
      - key: OCR_CELL_CONCURRENCY
        value: 2
      - key: IMAGE_CROP_CONCURRENCY
        value: 2
      - key: USE_PYTHON_OCR
        value: true
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
